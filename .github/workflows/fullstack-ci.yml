name: Fullstack Web CI

on:
  pull_request:
    branches: [main, Final]
  push:
    branches: [main, Final]

permissions:
  contents: read

jobs:
  frontend:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: FastAPI tests and MySQL smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_USER: root
      DB_PASSWORD: ci-mysql-password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q
      - name: Import the MySQL schema and check the public API
        env:
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql -uroot --default-character-set=utf8mb4 < ../thuyet_minh.sql
          python -m scripts.check_db
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              ready = client.get('/health/ready')
              ready.raise_for_status()
              response = client.get('/api/v1/pois')
              response.raise_for_status()
              assert len(response.json()) == 3, response.json()
          PY
