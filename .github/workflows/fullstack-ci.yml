name: Fullstack Web CI

on:
  pull_request:
    branches: [main, Final]
  push:
    branches: [main, Final]

permissions:
  contents: read

jobs:
  frontend:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: FastAPI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q app scripts tests
      - name: Start MongoDB replica set
        working-directory: .
        run: |
          docker run -d --name test-mongo -p 127.0.0.1:27019:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec test-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0", members:[{_id:0, host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec test-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs test-mongo
          exit 1
      - name: Run tests
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27019/?directConnection=true
        run: python -m pytest -q

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        env:
          SUPERADMIN_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet
